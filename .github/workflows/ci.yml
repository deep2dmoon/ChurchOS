# continue integration for the message producer 

name: CI for ChurcOS

on:
  workflow_dispatch

env:
  WEB_APP_NAME: "ChurchOs"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
        
      - name: install dependencies
        run: dotnet restore

      - name: build 
        run: dotnet build --no-restore 


      
    


  

